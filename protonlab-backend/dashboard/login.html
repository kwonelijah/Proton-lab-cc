<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap");
  :root{--ink:#0A0A0A;--page:#F5F4F0;--raised:#FFFFFF;--muted:#595959;--control:#BDBBB4;--signal:#B3261E;
    --body:"Montserrat",-apple-system,system-ui,"Segoe UI",sans-serif;color-scheme:light dark}
  @media (prefers-color-scheme: dark){:root{--ink:#F2F1EC;--page:#0E0E0D;--raised:#1A1A19;--muted:#A3A19B;--control:#4A4A47;--signal:#FF7468}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);background:var(--page);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left));
    -webkit-font-smoothing:antialiased}
  form{width:100%;max-width:360px}
  .logo{display:block;height:36px;width:auto;margin:0 auto 32px}
  .lg-dark{display:none}
  @media (prefers-color-scheme: dark){.lg-light{display:none}.lg-dark{display:block}}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  input{width:100%;font:500 16px var(--body);padding:12px 14px;border:1px solid var(--control);border-radius:10px;background:var(--raised);margin:0 0 18px;color:var(--ink)}
  input:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  button{width:100%;min-height:48px;font:600 15px var(--body);background:var(--ink);color:var(--page);border:0;border-radius:12px;cursor:pointer}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  button:disabled{opacity:.55;cursor:default}
  .err{min-height:20px;font-size:13px;color:var(--signal);margin:12px 0 0}
</style>

  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Sign in</button>
  <p class="err" id="e" role="alert"></p>
</form>
<script>
  const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    b.disabled = true; e.textContent = '';
    try {
      const r = await fetch('/api/admin', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-PL': '1' },
        body: JSON.stringify({ action: 'login', u: document.getElementById('u').value, password: document.getElementById('p').value }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok) { location.replace('/dashboard'); return; }
      e.textContent = d.error || 'Sign-in failed';
    } catch {
      e.textContent = 'No connection — try again';
    }
    b.disabled = false;
  });
</script>
